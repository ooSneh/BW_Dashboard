services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dashboard-frontend
    ports:
      - "3274:80"
    volumes:
      - C:/Users/TEST/Documents/Sandbox/Aayush_Dashboard/data:/usr/share/nginx/html/data
      - C:/Users/TEST/Documents/Sandbox/Aayush_Dashboard/config:/usr/share/nginx/html/config
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dashboard-scraper
    volumes:
      - C:/Users/TEST/Documents/Sandbox/Aayush_Dashboard/data:/app/data
      - C:/Users/TEST/Documents/Sandbox/Aayush_Dashboard/config:/app/config
      - C:/Users/TEST/Documents/Sandbox/Aayush_Dashboard/secrets:/app/secrets
    restart: unless-stopped