server {
    listen 3274;   # 👈 change port here

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve live data from shared volume
    location /data/ {
        alias /data/;
    }

    # Disable caching for live data
    location = /data/data.json {
        add_header Cache-Control "no-store";
    }
}